name: Nightly Quality Validation

on:
  schedule:
    # 03:17 America/Sao_Paulo (UTC-3) = 06:17 UTC diariamente
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-quality-validation
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  nightly-validation:
    name: Nightly Quality Battery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      IS_NIGHTLY: true
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quality/package-lock.json

      - name: Install quality dependencies
        working-directory: quality
        run: npm ci

      - name: Gate 1 — Build and type safety
        working-directory: quality
        run: npm run typecheck

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "$E2E_ADMIN_EMAIL" || -z "$E2E_ADMIN_PASSWORD" ]]; then
            echo "::error::Configure the repository secrets E2E_ADMIN_EMAIL and E2E_ADMIN_PASSWORD."
            exit 1
          fi

      - name: Install Chromium
        working-directory: quality
        run: npx playwright install --with-deps chromium

      - name: Setup k6
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: 2.1.0

      - name: Gate 2 — Start healthy SUT in isolated environment
        run: docker compose -f sut/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Create ephemeral CI administrator
        shell: bash
        run: >-
          docker compose -f sut/docker-compose.yml exec -T
          -e E2E_ADMIN_EMAIL -e E2E_ADMIN_PASSWORD evershop
          sh -c 'npm run user:create -- --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD" --name "QEL Nightly Administrator"'

      - name: Gate 3 — Functional, API and security automation
        working-directory: quality
        run: npm test

      - name: Gate 4 — Daily performance regression smoke
        working-directory: quality
        run: npm run performance:smoke

      - name: Generate Quality Summary Report & Manifest
        if: ${{ !cancelled() && hashFiles('quality/test-results/results.json') != '' }}
        working-directory: quality
        run: npm run report:summary

      - name: Gate 5 — Verify evidence outputs
        if: ${{ success() }}
        shell: bash
        run: |
          test -f quality/test-results/results.json
          test -f output/pdf/quality-report-latest.pdf
          test -f output/quality-summary.json
          compgen -G 'output/pdf/quality-report_*.pdf' > /dev/null
          compgen -G 'quality/performance-smoke-*-summary.json' > /dev/null

      - name: Build Quality Evidence Hub
        if: ${{ success() }}
        run: node portfolio/scripts/build.mjs

      - name: Configure GitHub Pages
        if: ${{ success() }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ success() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio/dist

      - name: Deploy Quality Evidence Hub to GitHub Pages
        if: ${{ success() }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish nightly test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-quality-evidence-${{ github.run_number }}
          path: |
            quality/playwright-report/
            quality/test-results/
            quality/performance-*-summary.json
            output/pdf/quality-report_*.pdf
            output/pdf/quality-report-latest.pdf
            output/quality-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup SUT
        if: ${{ always() }}
        run: docker compose -f sut/docker-compose.yml down --volumes --remove-orphans
